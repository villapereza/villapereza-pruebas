<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Actualizar Villa Pereza</title>
</head>
<body style="font-family:system-ui,sans-serif;padding:32px;text-align:center">
  <h1>Actualizando Villa Pereza…</h1>
  <p>Se están eliminando versiones antiguas.</p>
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map(name => caches.delete(name)));
        }
        Object.keys(localStorage)
          .filter(key => key.startsWith('vp_public_cache_'))
          .forEach(key => localStorage.removeItem(key));
      } catch (error) {
        console.warn('No se pudo limpiar toda la caché:', error);
      }
      location.replace('admin.html?v=8.0.1&fresh=' + Date.now());
    })();
  </script>
</body>
</html>
