<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Actualizar Villa Pereza</title></head>
<body style="font-family:system-ui,sans-serif;padding:32px;text-align:center"><h1>Actualizando Villa Pereza…</h1><p>Se están eliminando versiones antiguas.</p>
<script>
(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}if('caches'in window){const ns=await caches.keys();await Promise.all(ns.map(n=>caches.delete(n)));}['vp_public_cache_v1','vp_public_cache_v8'].forEach(k=>localStorage.removeItem(k));}catch(e){}location.replace('admin.html?v=8.0.0&fresh='+Date.now());})();
</script></body></html>
