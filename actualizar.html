  <style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#172033;color:white;text-align:center;padding:24px}main{max-width:480px}h1{margin-bottom:8px}p{opacity:.85}</style>

<body><main><h1>Actualizando Villa Pereza</h1><p>Eliminando versiones anteriores…</p></main>
<script>
(async()=>{
  try {
    if ('serviceWorker' in navigator) {
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if ('caches' in window) {
      const names=await caches.keys();
      await Promise.all(names.map(n=>caches.delete(n)));
    }
    localStorage.removeItem('vp_api_info');
    sessionStorage.clear();
  } catch(e) {}
  location.replace('admin.html?v=803&fresh='+Date.now());
})();
</script></body></html>
